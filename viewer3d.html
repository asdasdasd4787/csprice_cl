  <!-- The crafter moved from /viewer3d/?skin=AK-47+%7C+Ice+Coaled&wear=... to
       /skin-crafter/ak-47-ice-coaled/field-tested/. Old links keep working:
       the skin and wear are translated into the new path, and anything else
       they carried (charm, sticker) travels on as a query. -->
  <script>
  (function () {
    var base = location.pathname.replace(/viewer3d(\.html)?\/?$/i, "");
    var params = new URLSearchParams(location.search);
    var slug = function (value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .replace(/-+/g, "-");
    };
    var wearNames = {
      fn: "factory-new", mw: "minimal-wear", ft: "field-tested",
      ww: "well-worn", bs: "battle-scarred"
    };
    var rawSkin = (params.get("skin") || params.get("hash") || params.get("name") || "").trim();
    // "AK-47 | Ice Coaled (Field-Tested)" carries its wear in the name.
    var inName = rawSkin.match(/\s*\((Factory New|Minimal Wear|Field-Tested|Well-Worn|Battle-Scarred)\)\s*$/i);
    if (inName) rawSkin = rawSkin.slice(0, inName.index);
    var rawWear = (params.get("wear") || (inName ? inName[1] : "")).trim();
    var wearSlug = wearNames[rawWear.toLowerCase()] || slug(rawWear);

    var target = base + "skin-crafter/";
    var skinSlug = slug(rawSkin);
    if (skinSlug) {
      target += skinSlug + "/" + (wearSlug ? wearSlug + "/" : "");
    }
    var keep = new URLSearchParams();
    ["charm", "sticker"].forEach(function (key) {
      var value = params.get(key);
      if (value) keep.set(key, value);
    });
    // No skin named: the landing page still needs the wear to honour it.
    if (!skinSlug && rawWear) keep.set("wear", rawWear);
    var query = keep.toString();
    location.replace(target + (query ? "?" + query : "") + location.hash);
  })();
  </script>
